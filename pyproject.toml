[project]
name = "repocopilot"
version = "0.1.0"
description = "Offline assistant for onboarding and PR review: Q/A with code citations."
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "chromadb>=0.5",
  "httpx>=0.27",
]

[project.scripts]
repocopilot = "repocopilot.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"